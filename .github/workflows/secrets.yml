name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks

      - name: Scan the whole Git history
        run: ./gitleaks detect --source . --redact --verbose

      - name: Generate synthetic canary in the runner only
        run: |
          printf 'CANARY_SECRET_%s\n' "$(openssl rand -hex 16)" > "$RUNNER_TEMP/lab-canary.txt"
          cat > "$RUNNER_TEMP/lab-gitleaks.toml" <<'EOF'
          title = "Synthetic canary detection test"
          [[rules]]
          id = "lab-synthetic-canary"
          description = "Runtime-only fake secret used to verify scanning"
          regex = '''CANARY_SECRET_[0-9a-f]{32}'''
          keywords = ["CANARY_SECRET_"]
          EOF

      - name: Prove Secret Scan catches the synthetic canary
        run: ./gitleaks dir "$RUNNER_TEMP/lab-canary.txt" --config "$RUNNER_TEMP/lab-gitleaks.toml" --redact --verbose
